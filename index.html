<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Itinerario Japón · Oct 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #121729;
    --bg-elevated: #1a2138;
    --bg-card: #1c2440;
    --rail: #2a335a;
    --paper: #f2ead9;
    --paper-dim: #b9b2a1;
    --gold: #d4af6a;
    --vermillion: #c9432c;
    --teal: #3f8f8a;
    --plum: #8064ad;
    --slate: #5c7fb8;
    --gray: #6b7280;
    --line: rgba(242,234,217,0.1);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    padding-bottom: 100px;
  }
  .hero{
    padding: 32px 20px 26px;
    background: linear-gradient(180deg, #1a2138 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--vermillion);
    position: relative;
    overflow: hidden;
  }
  .hero::before{
    content: "";
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,106,0.25) 0%, transparent 70%);
  }
  .hero::after{
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background-image:
      radial-gradient(circle at 0px 8px, transparent 9px, rgba(242,234,217,0.5) 9.5px, rgba(242,234,217,0.5) 10.5px, transparent 11px),
      radial-gradient(circle at 24px 8px, transparent 9px, rgba(242,234,217,0.5) 9.5px, rgba(242,234,217,0.5) 10.5px, transparent 11px),
      radial-gradient(circle at 48px 8px, transparent 9px, rgba(242,234,217,0.5) 9.5px, rgba(242,234,217,0.5) 10.5px, transparent 11px);
    background-size: 48px 22px;
    mask-image: linear-gradient(180deg, transparent 0%, black 55%, black 100%);
    pointer-events: none;
  }
  .hero-kicker-line{
    position: absolute;
    top: 0; left: 0;
    width: 5px; height: 100%;
    background: linear-gradient(180deg, var(--vermillion), transparent);
  }
  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 8px;
  }
  h1{
    font-family: 'Shippori Mincho', serif;
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.15;
    color: var(--paper);
  }
  .hero-sub{
    font-size: 13.5px;
    color: var(--paper-dim);
    margin: 0;
  }
  .stats{
    display: flex;
    gap: 18px;
    margin-top: 18px;
  }
  .stat{
    font-family: 'JetBrains Mono', monospace;
  }
  .stat .n{
    font-size: 20px;
    font-weight: 600;
    color: var(--gold);
    display:block;
  }
  .stat .l{
    font-size: 10px;
    color: var(--paper-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .timeline{
    padding: 28px 16px 0;
    position: relative;
  }
  .day{
    display: flex;
    gap: 14px;
    position: relative;
  }
  .rail-col{
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 22px;
    flex-shrink: 0;
  }
  .dot{
    width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--vermillion);
    border: 1.5px solid rgba(242,234,217,0.55);
    outline: 1px solid rgba(201,67,44,0.4);
    outline-offset: 2px;
    margin-top: 16px;
    flex-shrink: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(-3deg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .dot span{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--paper);
    transform: rotate(3deg);
  }
  .connector{
    width: 2px;
    flex: 1;
    background: repeating-linear-gradient(180deg, var(--rail) 0, var(--rail) 4px, transparent 4px, transparent 8px);
    margin-top: 2px;
  }
  .day:last-child .connector{ display:none; }

  .card{
    flex: 1;
    background:
      repeating-linear-gradient(115deg, rgba(242,234,217,0.015) 0px, rgba(242,234,217,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg-card);
    border: 1px solid var(--line);
    border-top: 2px solid var(--vermillion);
    border-radius: 4px 4px 10px 10px;
    margin-bottom: 16px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  .card-head{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 10px;
    cursor: pointer;
    gap: 10px;
  }
  .date-block{
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.1;
  }
  .date-block .dow{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--paper-dim);
    display:block;
  }
  .date-block .dnum{
    font-size: 18px;
    font-weight: 600;
    color: var(--paper);
  }
  .head-meta{
    flex: 1;
    min-width: 0;
  }
  .city-name{
    font-family: 'Shippori Mincho', serif;
    font-size: 16.5px;
    font-weight: 700;
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kanji-tag{
    font-family: 'Shippori Mincho', serif;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--paper-dim);
    letter-spacing: 0.05em;
  }
  .chip{
    display: inline-block;
    font-size: 10.5px;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }
  .chevron{
    color: var(--paper-dim);
    font-size: 13px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .card.open .chevron{ transform: rotate(180deg); }

  .card-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }
  .card.open .card-body{ max-height: 900px; }
  .card-body-inner{
    padding: 4px 14px 16px;
    border-top: 1px solid var(--line);
    padding-top: 12px;
  }

  .note-line{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 5px 0;
  }
  .note-line.heading{
    font-weight: 600;
    color: var(--gold);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding-top: 8px;
  }
  .note-line input[type=checkbox]{
    margin-top: 3px;
    accent-color: var(--gold);
    flex-shrink: 0;
    width: 15px; height: 15px;
  }
  .note-line.checked .txt{
    text-decoration: line-through;
    color: var(--paper-dim);
  }
  .note-line .txt{ flex: 1; }

  .edit-row{
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .field{
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--paper-dim);
    font-family: 'JetBrains Mono', monospace;
  }
  input[type=text], input[type=date], select, textarea{
    background: var(--bg-elevated);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    width: 100%;
  }
  textarea{
    min-height: 90px;
    resize: vertical;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.5;
    margin-top: 10px;
  }
  select{ appearance:none; }

  .activity-edit-list{
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .activity-edit-row{
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .activity-edit-row input[type=text]{
    flex: 1;
  }
  .remove-activity{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--paper-dim);
    border-radius: 8px;
    width: 34px; height: 34px;
    flex-shrink: 0;
    font-size: 14px;
    cursor: pointer;
  }
  .hint{
    font-size: 12.5px;
    color: var(--paper-dim);
    margin: 2px 0;
  }
  .notes-block{
    margin-top: 10px;
    padding: 10px 12px;
    background: var(--bg-elevated);
    border-left: 2px solid var(--vermillion);
    border-radius: 0 8px 8px 0;
  }
  .notes-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--vermillion);
    margin: 0 0 4px;
  }
  .notes-text{
    font-size: 13px;
    line-height: 1.55;
    color: var(--paper-dim);
    margin: 0;
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top: 12px;
  }
  .btn{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .btn-save{ background: var(--gold); color: #1a1508; font-weight:600; }
  .btn-del{ background: transparent; color: var(--vermillion); border: 1px solid var(--vermillion); }
  .btn-edit{ background: var(--bg-elevated); color: var(--paper-dim); border: 1px solid var(--line); }

  .fab{
    position: fixed;
    bottom: 24px; right: 20px;
    width: 54px; height: 54px;
    border-radius: 10px;
    background: var(--vermillion);
    color: var(--paper);
    font-size: 26px;
    font-weight: 300;
    border: 1.5px solid rgba(242,234,217,0.5);
    outline: 1px solid rgba(201,67,44,0.5);
    outline-offset: 3px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 10;
    transform: rotate(-2deg);
  }
  .status{
    position: fixed;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-elevated);
    border: 1px solid var(--vermillion);
    color: var(--paper-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .status.show{ opacity: 1; }
  .empty{
    text-align:center;
    padding: 40px 20px;
    color: var(--paper-dim);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="status" id="status">guardado</div>

<div class="hero">
  <div class="hero-kicker-line"></div>
  <p class="eyebrow">東京 · 大阪 · 京都</p>
  <h1>Viaje a Japón</h1>
  <p class="hero-sub">Itinerario compartido · toca un día para ver o editar detalles</p>
  <div class="stats">
    <div class="stat"><span class="n" id="statDays">–</span><span class="l">días</span></div>
  </div>
</div>

<div class="timeline" id="timeline">
  <div class="empty">Cargando itinerario…</div>
</div>

<button class="fab" id="addDayBtn" title="Agregar día">+</button>

<script>
const STORAGE_KEY = 'itinerario-japon-days'; // usado solo como fallback local
const DOW = ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];

// ====== CONFIGURA ESTO CON TUS DATOS DE SUPABASE ======
const SUPABASE_URL = 'https://uxtvgscbpbohegwjegjq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4dHZnc2NicGJvaGVnd2plZ2pxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3Nzk5MTMsImV4cCI6MjA5OTM1NTkxM30.ejpNi9MPJnsgbMSB5nfWiZEAVeWDh2j9J2U4FvuqUl4';
// =========================================================
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORY_STYLES = {
  'Tiempo libre': { bg:'rgba(92,127,184,0.18)', fg:'#8fa9d6' },
  'Shopping':     { bg:'rgba(212,175,106,0.18)', fg:'#d4af6a' },
  'Viajando':     { bg:'rgba(201,67,44,0.18)',   fg:'#e0715a' },
  'Sin categoría':{ bg:'rgba(107,114,128,0.18)', fg:'#9aa0aa' }
};
const CITY_KANJI = {
  'seattle': 'シアトル', 'ginza': '銀座', 'tokio': '東京', 'tokyo': '東京',
  'osaka': '大阪', 'kyoto': '京都', 'kioto': '京都',
  'yokohama': '横浜', 'hakone': '箱根', 'nikko': '日光', 'nikkō': '日光'
};
const CITY_COLORS = {
  'seattle': '#6b7280', 'ginza': '#d4af6a', 'tokio': '#d4af6a', 'tokyo': '#d4af6a',
  'osaka': '#3f8f8a', 'kyoto': '#8064ad', 'kioto': '#8064ad',
  'yokohama': '#5c7fb8', 'hakone': '#7a9d54', 'nikko': '#b06a3f', 'nikkō': '#b06a3f'
};

const DEFAULT_DAYS = [
  {id:'d1', date:'2026-10-09', city:'Seattle', category:'Tiempo libre', notes:'Seattle', checked:{}},
  {id:'d2', date:'2026-10-10', city:'Seattle', category:'Tiempo libre', notes:'Seattle', checked:{}},
  {id:'d3', date:'2026-10-11', city:'Seattle', category:'Tiempo libre', notes:'Seattle', checked:{}},
  {id:'d4', date:'2026-10-12', city:'Ginza', category:'Tiempo libre',
    notes:'- Llegamos a Japón en la noche, aterrizamos 7:00 pm\n- Ir a Ramen Hidakaya Higashi-Ginza shop\n- Si hay tiempo, ir al Donki de Remm Plus', checked:{}},
  {id:'d5', date:'2026-10-13', city:'Ginza / Shibuya', category:'Shopping',
    notes:'Shopping Day\n- Café y algo rápido en DOUTOR o TURRET CAFE cerca del hotel (abren 7 am)\n- Ir a Shibuya al Mega Donquijote, de ahí a Bic Camera\n- Según el tiempo: comer bien o Family Mart / fast food\n- 2:00 pm ir a outlet, llegaríamos a las 3\n- Al final del día: Uniqlo y Muji de Ginza para comprar algo de ropa', checked:{}},
  {id:'d6', date:'2026-10-14', city:'Osaka', category:'Viajando',
    notes:'Vamos a Osaka temprano para aprovechar el día allá', checked:{}},
  {id:'d7', date:'2026-10-15', city:'Kioto', category:'Sin categoría', notes:'Kyoto day trip', checked:{}},
  {id:'d8', date:'2026-10-16', city:'Osaka', category:'Sin categoría', notes:'Osaka day trip', checked:{}},
  {id:'d9', date:'2026-10-17', city:'Osaka', category:'Sin categoría', notes:'Osaka day', checked:{}},
  {id:'d10', date:'2026-10-18', city:'Tokio', category:'Viajando', notes:'Notas', checked:{}},
  {id:'d11', date:'2026-10-19', city:'Yokohama', category:'Sin categoría', notes:'Yokohama', checked:{}},
  {id:'d12', date:'2026-10-20', city:'Tokio', category:'Sin categoría', notes:'Notas', checked:{}},
  {id:'d13', date:'2026-10-21', city:'Tokio', category:'Sin categoría', notes:'Notas', checked:{}},
  {id:'d14', date:'2026-10-22', city:'Tokio', category:'Tiempo libre', notes:'Último día en Tokio, a las 9:00 pm nos vamos al aeropuerto', checked:{}},
];

let days = [];
let openId = null;
let editId = null;

function migrateDay(day){
  if(!Array.isArray(day.activities)){
    const lines = (day.notes||'').split('\n').filter(l => l.trim().length);
    const activities = [];
    const noteLines = [];
    lines.forEach((line, i) => {
      const trimmed = line.trim();
      if(trimmed.startsWith('-')){
        activities.push({ text: trimmed.replace(/^-\s*/, ''), checked: !!(day.checked && day.checked[i]) });
      } else {
        noteLines.push(trimmed);
      }
    });
    day.activities = activities;
    day.notes = noteLines.join('\n');
    delete day.checked;
  }
  return day;
}

function showStatus(msg){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=> el.classList.remove('show'), 1400);
}

async function loadDays(){
  try{
    const { data, error } = await supabaseClient
      .from('itinerary_days')
      .select('*')
      .order('date', { ascending: true });
    if(error) throw error;

    if(data && data.length){
      days = data.map(rowToDay).map(migrateDay);
      cacheLocally();
      return;
    }

    // tabla vacía todavía: sembramos los datos por default
    days = DEFAULT_DAYS.map(migrateDay);
    for(const day of days){ await upsertDayRemote(day); }
    cacheLocally();
  }catch(e){
    console.warn('No se pudo conectar a Supabase, usando copia local si existe.', e);
    const cached = localStorage.getItem(STORAGE_KEY);
    days = cached ? JSON.parse(cached).map(migrateDay) : DEFAULT_DAYS.map(migrateDay);
    showStatus('sin conexión, mostrando copia local');
  }
}

function cacheLocally(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(days)); }catch(e){}
}

function rowToDay(row){
  return {
    id: row.id,
    date: row.date,
    city: row.city || '',
    category: row.category || 'Sin categoría',
    activities: row.activities || [],
    notes: row.notes || ''
  };
}

async function upsertDayRemote(day, notify){
  cacheLocally();
  try{
    const { error } = await supabaseClient.from('itinerary_days').upsert({
      id: day.id,
      date: day.date,
      city: day.city,
      category: day.category,
      activities: day.activities,
      notes: day.notes,
      updated_at: new Date().toISOString()
    });
    if(error) throw error;
    if(notify) showStatus('guardado ✓');
  }catch(e){
    console.warn('Error guardando en Supabase', e);
    if(notify) showStatus('sin conexión, se reintentará');
  }
}

async function deleteDayRemote(id){
  try{
    const { error } = await supabaseClient.from('itinerary_days').delete().eq('id', id);
    if(error) throw error;
  }catch(e){
    console.warn('Error eliminando en Supabase', e);
  }
  cacheLocally();
}

function cityColor(city){
  const key = (city||'').trim().toLowerCase().split('/')[0].trim();
  return CITY_COLORS[key] || '#8a8fa3';
}

function cityKanji(city){
  const key = (city||'').trim().toLowerCase().split('/')[0].trim();
  return CITY_KANJI[key] || '';
}

function fmtDate(dstr){
  const d = new Date(dstr + 'T00:00:00');
  if(isNaN(d)) return {dow:'', num: dstr};
  return { dow: DOW[d.getDay()], num: `${d.getDate()} oct` };
}

function parseNotes(notes){
  return (notes||'').split('\n').filter(l => l.trim().length);
}

function render(){
  days.sort((a,b)=> a.date.localeCompare(b.date));
  const tl = document.getElementById('timeline');
  document.getElementById('statDays').textContent = days.length;

  if(!days.length){
    tl.innerHTML = '<div class="empty">No hay días todavía. Toca + para agregar uno.</div>';
    return;
  }

  tl.innerHTML = days.map((day, idx) => {
    const { dow, num } = fmtDate(day.date);
    const color = cityColor(day.city);
    const catStyle = CATEGORY_STYLES[day.category] || CATEGORY_STYLES['Sin categoría'];
    const isOpen = openId === day.id;
    const isEditing = editId === day.id;

    let bodyContent;
    if(isEditing){
      const activities = day.activities || [];
      bodyContent = `
        <div class="edit-row">
          <div class="field">
            <label>Fecha</label>
            <input type="date" value="${day.date}" data-field="date" data-id="${day.id}">
          </div>
          <div class="field">
            <label>Ciudad</label>
            <input type="text" value="${escapeAttr(day.city)}" data-field="city" data-id="${day.id}">
          </div>
        </div>
        <div class="field" style="margin-top:8px;">
          <label>Categoría</label>
          <select data-field="category" data-id="${day.id}">
            ${Object.keys(CATEGORY_STYLES).map(c => `<option value="${c}" ${c===day.category?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>

        <div class="field" style="margin-top:14px;">
          <label>Plan del día</label>
          <div class="activity-edit-list" data-activity-list="${day.id}">
            ${activities.length ? activities.map((act, i) => `
              <div class="activity-edit-row">
                <input type="text" value="${escapeAttr(act.text)}" data-activity-idx="${i}" data-id="${day.id}" placeholder="Ej. Ir al Ramen Hidakaya">
                <button type="button" class="remove-activity" data-action="remove-activity" data-idx="${i}" data-id="${day.id}">✕</button>
              </div>
            `).join('') : `<p class="hint">Aún no hay actividades. Agrega la primera abajo.</p>`}
          </div>
          <button type="button" class="btn btn-edit" style="margin-top:8px;" data-action="add-activity" data-id="${day.id}">+ Agregar actividad</button>
        </div>

        <div class="field" style="margin-top:14px;">
          <label>Notas generales</label>
          <textarea data-field="notes" data-id="${day.id}" placeholder="Horarios, ideas sueltas, reservaciones...">${escapeHtml(day.notes)}</textarea>
        </div>

        <div class="btn-row">
          <button class="btn btn-save" data-action="save" data-id="${day.id}">Guardar</button>
          <button class="btn btn-del" data-action="delete" data-id="${day.id}">Eliminar día</button>
        </div>
      `;
    } else {
      const activities = day.activities || [];
      const hasNotes = day.notes && day.notes.trim().length;
      bodyContent = `
        ${activities.map((act, i) => `
          <label class="note-line ${act.checked?'checked':''}">
            <input type="checkbox" data-check="${i}" data-id="${day.id}" ${act.checked?'checked':''}>
            <span class="txt">${escapeHtml(act.text)}</span>
          </label>
        `).join('')}
        ${hasNotes ? `
          <div class="notes-block">
            <p class="notes-label">Notas</p>
            <p class="notes-text">${escapeHtml(day.notes).replace(/\n/g,'<br>')}</p>
          </div>
        ` : ''}
        ${(!activities.length && !hasNotes) ? `<p class="hint">Sin plan todavía.</p>` : ''}
        <div class="btn-row">
          <button class="btn btn-edit" data-action="edit" data-id="${day.id}">Editar</button>
        </div>
      `;
    }

    return `
      <div class="day">
        <div class="rail-col">
          <div class="dot" style="outline-color:${color}55;"><span>${idx+1}</span></div>
          <div class="connector"></div>
        </div>
        <div class="card ${isOpen || isEditing ? 'open':''}" style="border-color:${isOpen?color+'55':'var(--line)'}">
          <div class="card-head" data-toggle="${day.id}">
            <div class="date-block">
              <span class="dow">${dow}</span>
              <span class="dnum">${num}</span>
            </div>
            <div class="head-meta">
              <p class="city-name" style="color:${color}">${escapeHtml(day.city || 'Sin ciudad')}${cityKanji(day.city) ? ` <span class="kanji-tag">${cityKanji(day.city)}</span>` : ''}</p>
              <span class="chip" style="background:${catStyle.bg}; color:${catStyle.fg}">${day.category || 'Sin categoría'}</span>
            </div>
            <div class="chevron">▾</div>
          </div>
          <div class="card-body">
            <div class="card-body-inner">${bodyContent}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  attachHandlers();
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

function attachHandlers(){
  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      if(editId === id) return;
      openId = (openId === id) ? null : id;
      render();
    });
  });

  document.querySelectorAll('[data-check]').forEach(el=>{
    el.addEventListener('click', (e)=> e.stopPropagation());
    el.addEventListener('change', async (e)=>{
      const id = el.getAttribute('data-id');
      const idx = el.getAttribute('data-check');
      const day = days.find(d=>d.id===id);
      day.activities[idx].checked = el.checked;
      await upsertDayRemote(day, true);
      render();
    });
  });

  document.querySelectorAll('[data-action="add-activity"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const day = days.find(d=>d.id===id);
      if(!Array.isArray(day.activities)) day.activities = [];
      day.activities.push({ text:'', checked:false });
      render();
      setTimeout(()=>{
        const inputs = document.querySelectorAll(`[data-activity-idx][data-id="${id}"]`);
        const last = inputs[inputs.length-1];
        if(last) last.focus();
      }, 30);
    });
  });

  document.querySelectorAll('[data-action="remove-activity"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      const day = days.find(d=>d.id===id);
      day.activities.splice(idx, 1);
      render();
    });
  });

  document.querySelectorAll('[data-action="edit"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      editId = el.getAttribute('data-id');
      openId = editId;
      render();
    });
  });

  document.querySelectorAll('[data-action="delete"]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      if(!confirm('¿Eliminar este día del itinerario?')) return;
      days = days.filter(d=>d.id !== id);
      editId = null; openId = null;
      await deleteDayRemote(id);
      cacheLocally();
      render();
    });
  });

  document.querySelectorAll('[data-action="save"]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-id');
      const day = days.find(d=>d.id===id);
      const container = el.closest('.card-body-inner');
      container.querySelectorAll('[data-field]').forEach(f=>{
        const field = f.getAttribute('data-field');
        day[field] = f.value;
      });
      container.querySelectorAll('[data-activity-idx]').forEach(f=>{
        const idx = parseInt(f.getAttribute('data-activity-idx'), 10);
        if(day.activities[idx]) day.activities[idx].text = f.value;
      });
      day.activities = (day.activities || []).filter(a => a.text.trim().length);
      editId = null;
      await upsertDayRemote(day, true);
      render();
    });
  });
}

document.getElementById('addDayBtn').addEventListener('click', async ()=>{
  const lastDate = days.length ? days[days.length-1].date : '2026-10-08';
  const next = new Date(lastDate + 'T00:00:00');
  next.setDate(next.getDate()+1);
  const iso = next.toISOString().slice(0,10);
  const id = 'd' + Date.now();
  days.push({ id, date: iso, city: '', category: 'Sin categoría', activities: [], notes: '' });
  editId = id; openId = id;
  await upsertDayRemote(days[days.length-1], true);
  render();
  setTimeout(()=>{
    const card = document.querySelector(`[data-id="${id}"][data-field="city"]`);
    if(card) card.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
});

(async function init(){
  await loadDays();
  render();
})();
</script>
</body>
</html>
